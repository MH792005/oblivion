name: Project Oblivion Production CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27d
          link-to-sdk: true

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, armv7-linux-androideabi

      - name: Install Cargo NDK
        run: cargo install cargo-ndk

      - name: Grant Execute Permissions for Gradlew
        run: chmod +x gradlew

      - name: Build Full Monorepo & Integration Test App
        run: ./gradlew assembleRelease --stacktrace

      - name: Archive De-obfuscation Mapping Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oblivion-deobfuscation-mapping
          path: build/outputs/oblivion/mapping.txt
